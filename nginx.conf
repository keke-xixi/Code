# ============================================================
# 部署步骤（在服务器上执行）：
#   sudo cp /etc/nginx/nginx.conf /etc/nginx/nginx.conf.bak.$(date +%F)
#   sudo cp nginx.conf /etc/nginx/nginx.conf
#   sudo mv /etc/nginx/conf.d/default.conf /etc/nginx/conf.d/default.conf.bak 2>/dev/null || true
#   sudo nginx -t && sudo systemctl reload nginx
#   curl -s http://127.0.0.1/wx-api/api/health
# 期望输出 JSON：{"code":200,...}  不能是 HTML
# ============================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    client_max_body_size 200m;

    server {
        listen       80 default_server;
        listen       [::]:80 default_server;
        server_name  _;

        root /home/front/build;
        index index.html;

        # 云笔记小程序后端（5010）— 必须在 location / 之前，且用 ^~ 前缀匹配
        location ^~ /wx-api/ {
            proxy_pass http://127.0.0.1:5010/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # 原后端 API（3001）
        location ^~ /api/ {
            proxy_pass http://127.0.0.1:3001/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /index.html {
            root /home/front/build;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # 重要：conf.d 里若有 default.conf 会抢 80 端口，导致 /wx-api/ 不生效
    # 部署前请备份移走：sudo mv /etc/nginx/conf.d/default.conf /etc/nginx/conf.d/default.conf.bak
    # include /etc/nginx/conf.d/*.conf;
}
